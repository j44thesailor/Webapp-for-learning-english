<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Arcade — Học Tiếng Anh Qua Trò Chơi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside>
  <div class="aside-in">
    <div class="brand"><span class="brand-dot"></span><h1>Word Arcade</h1></div>
    <div class="sub">học tiếng anh qua trò chơi</div>
    <div class="sec-label">Chế độ chơi</div>
    <div id="modes"></div>
    <div class="aside-tools">
      <button class="btn menu-upload" id="menuUpload">+ Nạp file từ vựng</button>
      <div id="status"></div>
    </div>
  </div>
</aside>

<main>
  <div id="frame">
    <div id="floatLayer"></div>
    <pre id="art"></pre>

    <!-- Nơi từng Game Mode tự render canvas & controls của riêng nó -->
    <div id="modeHost"></div>

    <!-- Thanh công cụ trên cùng -->
    <div id="bar">
      <div class="grp">
        <button class="btn" id="back">&larr; Menu</button>
        <div class="music-bar hidden" id="musicBar">
          <span class="m-dot"></span>
          <button class="m-btn" id="musicPrev" title="Bài trước">⏮</button>
          <button class="m-btn" id="musicPlay" title="Tạm dừng / Tiếp tục">⏸</button>
          <button class="m-btn" id="musicNext" title="Đổi bài ngẫu nhiên">⏭</button>
          <span class="m-track" id="musicTitle">...</span>
        </div>
      </div>

      <div id="hud"></div>

      <div class="grp">
        <div class="grp" id="barTools"></div>
        <button class="btn" id="upload">Nạp từ vựng</button>
        <input type="file" id="file" accept=".txt,.csv,.tsv,.json,text/plain" hidden>
      </div>
    </div>

    <div id="ov"><div id="ovBody"></div></div>
  </div>
  <div id="meta"><span id="counter"></span><span id="vocabMeta"></span></div>
</main>

<script src="arts.js"></script>
<script src="playlist.js"></script>
<script src="music.js"></script>
<script src="core.js"></script>
<script src="modes/cannon.js"></script>
</body>
</html>
