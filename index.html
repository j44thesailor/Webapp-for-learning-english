<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Arcade</title>
<style>
  :root { --fg:#000; --bg:#fff; --mute:#777; --line:#000; --ease:cubic-bezier(.7,0,.2,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: grid; grid-template-columns: 300px 1fr; height: 100vh;
    transition: grid-template-columns .7s var(--ease);
  }
  body.game { grid-template-columns: 0px 1fr; }

  /* LEFT: menu */
  aside {
    border-right: 1px solid var(--line); overflow: hidden; min-width: 0;
    transition: opacity .3s, border-color .7s;
  }
  body.game aside { opacity: 0; pointer-events: none; border-right-color: transparent; }
  .aside-in { width: 299px; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto; }
  h1 { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
  .sub { font-size: 11px; color: var(--mute); margin-bottom: 18px; }
  #modes { display: flex; flex-direction: column; gap: 10px; }
  .mode {
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
    padding: 12px 14px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); display: flex; justify-content: space-between;
    transition: background .12s, color .12s;
  }
  .mode:hover, .mode:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
  .mode .idx { color: var(--mute); }
  .mode:hover .idx, .mode:focus-visible .idx { color: #aaa; }
  #status { margin-top: auto; font-size: 11px; color: var(--mute); min-height: 1.4em; }

  /* RIGHT: display */
  main { padding: 28px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; transition: padding .7s var(--ease); }
  body.game main { padding: 12px; }
  #frame { flex: 1; border: 1px solid var(--line); position: relative; overflow: hidden; min-height: 0; }
  #art {
    position: absolute; top: 0; left: 0; transform-origin: 0 0;
    font-size: 12px; line-height: 1; white-space: pre; color: var(--fg);
    user-select: none; will-change: transform; transition: opacity .4s;
  }
  body.game #art { opacity: 0; }
  #meta { font-size: 11px; color: var(--mute); display: flex; justify-content: space-between; }
  body.game #meta { display: none; }

  /* GAME layer */
  #game { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; opacity: 0; }
  body.game #game { visibility: visible; opacity: 1; transition: opacity .4s .5s; }
  #bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px; visibility: hidden; opacity: 0;
  }
  body.game #bar, body.game #answer { visibility: visible; opacity: 1; transition: opacity .4s .5s; }
  .grp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn, select.btn {
    font: inherit; font-size: 12px; cursor: pointer; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); padding: 8px 12px; transition: background .12s, color .12s;
  }
  .btn:hover, .btn:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
  select.btn:hover { background: var(--bg); color: var(--fg); }
  #hud { font-size: 12px; letter-spacing: .08em; white-space: nowrap; }
  #vocabInfo { font-size: 11px; color: var(--mute); }
  #answer {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 3;
    width: min(420px, 80%); padding: 12px 14px; font: inherit; font-size: 16px; text-align: center;
    border: 2px solid var(--line); background: var(--bg); color: var(--fg); outline: none;
    visibility: hidden; opacity: 0;
  }
  #answer.shake { animation: shake .3s; }
  @keyframes shake { 20%{transform:translateX(calc(-50% - 8px))} 40%{transform:translateX(calc(-50% + 8px))} 60%{transform:translateX(calc(-50% - 5px))} 80%{transform:translateX(calc(-50% + 5px))} }
  #over {
    position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: rgba(255,255,255,.9);
  }
  #over.on { display: flex; }
  #over h2 { font-size: 28px; letter-spacing: .15em; }
  #over p { font-size: 13px; color: var(--mute); }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    body.game { grid-template-columns: 1fr; grid-template-rows: 0px 1fr; height: 100vh; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .aside-in { width: auto; }
    main { height: 70vh; }
    body.game main { height: auto; }
  }
</style>
</head>
<body>

<aside>
  <div class="aside-in">
    <h1>Word Arcade</h1>
    <div class="sub">learn english by playing</div>
    <div id="modes"></div>
    <div id="status"></div>
  </div>
</aside>

<main>
  <div id="frame">
    <pre id="art"></pre>
    <canvas id="game"></canvas>

    <div id="bar">
      <div class="grp"><button class="btn" id="back">&larr; Menu</button></div>
      <div id="hud"></div>
      <div class="grp">
        <span id="vocabInfo"></span>
        <select class="btn" id="diff" title="Difficulty">
          <option value="auto">Progressive</option>
          <option value="0.3">Easy</option>
          <option value="0.6">Medium</option>
          <option value="1">Hard</option>
        </select>
        <button class="btn" id="upload">Upload vocab</button>
        <input type="file" id="file" accept=".txt,.csv,.tsv,.json,text/plain" hidden>
      </div>
    </div>

    <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the word...">

    <div id="over">
      <h2>GAME OVER</h2>
      <p id="overScore"></p>
      <button class="btn" id="restart">Play again</button>
    </div>
  </div>
  <div id="meta"><span id="counter"></span><span>auto-cycle</span></div>
</main>

<script src="arts.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const body = document.body;
  const frame = $("#frame");

  /* =====================================================
   *  ASCII DISPLAY
   * ===================================================== */
  const HOLD_MS = 8000, NOISE_MS = 700, MAX_SCALE = 4;
  const GLYPHS = "#%&@$*+=-:;.,/\\|<>?!0123456789";
  const pre = $("#art"), counter = $("#counter");
  const arts = window.ARTS || [];
  let cur = 0, busy = false, dims = [];

  function measure() {
    pre.style.transform = "none";
    dims = arts.map(t => { pre.textContent = t; return { w: pre.offsetWidth, h: pre.offsetHeight }; });
  }
  function fit(i) {
    if (!dims[i]) return;
    const { w, h } = dims[i], pad = 16;
    const s = Math.min((frame.clientWidth - pad * 2) / w, (frame.clientHeight - pad * 2) / h, MAX_SCALE);
    const x = (frame.clientWidth - w * s) / 2, y = (frame.clientHeight - h * s) / 2;
    pre.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  }
  const label = i => `art ${String(i + 1).padStart(2, "0")} / ${String(arts.length).padStart(2, "0")}`;
  function show(i) { pre.textContent = arts[i]; fit(i); counter.textContent = label(i); }
  function noisy(text, th, p) {
    let out = "";
    for (let k = 0; k < text.length; k++) {
      const c = text[k];
      out += (c === "\n" || th[k] > p) ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0];
    }
    return out;
  }
  function phase(i, from, to) {
    return new Promise(res => {
      const text = arts[i], th = Float32Array.from({ length: text.length }, Math.random);
      const t0 = performance.now(); let last = 0;
      (function tick(now) {
        const t = Math.min((now - t0) / NOISE_MS, 1);
        if (now - last > 33) { last = now; pre.textContent = noisy(text, th, from + (to - from) * t); }
        t < 1 ? requestAnimationFrame(tick) : res();
      })(t0);
    });
  }
  async function next() {
    if (busy || arts.length < 2 || body.classList.contains("game")) return;
    busy = true;
    const nxt = (cur + 1) % arts.length;
    await phase(cur, 0, 1);
    fit(nxt); counter.textContent = label(nxt);
    await phase(nxt, 1, 0);
    cur = nxt; show(cur); busy = false;
  }
  if (arts.length) { measure(); show(cur); setInterval(next, HOLD_MS + NOISE_MS * 2); }
  else pre.textContent = "No art found in arts.js";

  /* =====================================================
   *  VOCAB
   * ===================================================== */
  const DEFAULT_VOCAB = [
    ["apple","quả táo"],["knowledge","kiến thức"],["journey","hành trình"],["ancient","cổ xưa"],
    ["borrow","mượn"],["challenge","thử thách"],["delicious","ngon"],["environment","môi trường"],
    ["freedom","sự tự do"],["generous","hào phóng"],["honest","trung thực"],["improve","cải thiện"],
    ["knowledge base","cơ sở tri thức"],["lecture","bài giảng"],["mountain","ngọn núi"],["neighbor","hàng xóm"],
    ["opinion","ý kiến"],["patient","kiên nhẫn"],["quarrel","cãi nhau"],["reliable","đáng tin cậy"],
    ["suggest","gợi ý"],["tremendous","to lớn"],["unusual","khác thường"],["vacation","kỳ nghỉ"],
    ["wisdom","sự thông thái"],["yesterday","hôm qua"],["abandon","từ bỏ"],["brilliant","xuất sắc"],
    ["curious","tò mò"],["essential","thiết yếu"],
  ];
  let vocab = DEFAULT_VOCAB.slice();
  try {
    const saved = JSON.parse(localStorage.getItem("wa_vocab") || "null");
    if (Array.isArray(saved) && saved.length) vocab = saved;
  } catch (e) {}

  function parseVocab(text, filename) {
    text = text.replace(/^\uFEFF/, "");
    const out = [];
    const push = (en, vi) => {
      en = String(en ?? "").trim().replace(/^["']|["']$/g, "").trim();
      vi = String(vi ?? "").trim().replace(/^["']|["']$/g, "").trim();
      if (!en || !vi) return;
      if (["english", "en", "word"].includes(en.toLowerCase()) && out.length === 0) return; // header
      out.push([en, vi]);
    };
    const t = text.trim();
    if (/\.json$/i.test(filename) || t[0] === "[" || t[0] === "{") {
      try {
        const j = JSON.parse(t);
        if (Array.isArray(j)) j.forEach(it => {
          if (Array.isArray(it)) push(it[0], it[1]);
          else if (it && typeof it === "object")
            push(it.en ?? it.english ?? it.word, it.vi ?? it.vietnamese ?? it.meaning);
        });
        else if (j && typeof j === "object") Object.entries(j).forEach(([k, v]) => push(k, v));
        return out;
      } catch (e) { /* fall through to line parsing */ }
    }
    for (const raw of t.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      let idx = -1, len = 1;
      for (const d of ["\t", "|", ";", " - ", " – ", " — ", "=", ",", ":"]) {
        const k = line.indexOf(d);
        if (k > 0) { idx = k; len = d.length; break; }
      }
      if (idx > 0) push(line.slice(0, idx), line.slice(idx + len));
    }
    return out;
  }

  /* =====================================================
   *  GAME 1 — WORD CANNON
   * ===================================================== */
  const canvas = $("#game"), ctx = canvas.getContext("2d");
  const input = $("#answer"), hud = $("#hud"), vocabInfo = $("#vocabInfo");
  const overEl = $("#over");
  let W = 0, H = 0, raf = 0, last = 0, state = "idle";
  let enemies, shots, parts, floats, bag, score, lives, kills, spawnT, introT, shakeT, laneCount;
  const cannon = { x: -90, angle: 0, recoil: 0 };
  const TOP = 64, BOTTOM = 96, BLOCK_H = 58;
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeOut = p => 1 - Math.pow(1 - p, 3);

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    W = frame.clientWidth; H = frame.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(() => { fit(cur); sizeCanvas(); }).observe(frame);
  sizeCanvas();

  const level = () => 1 + Math.floor(kills / 5);
  const hideFrac = () => {
    const v = $("#diff").value;
    return v === "auto" ? Math.min(0.3 + 0.1 * (level() - 1), 1) : parseFloat(v);
  };
  const laneY = i => TOP + (i + 0.5) * (H - TOP - BOTTOM) / laneCount;
  const cannonY = () => TOP + (H - TOP - BOTTOM) / 2;
  const norm = s => s.toLowerCase().replace(/\s+/g, " ").trim();

  function nextWord() {
    if (!bag.length) {
      bag = vocab.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [bag[i], bag[j]] = [bag[j], bag[i]]; }
    }
    return vocab[bag.pop()];
  }
  function mask(word, f) {
    const chars = [...word];
    const idx = chars.map((c, i) => (/[\p{L}\d]/u.test(c) ? i : -1)).filter(i => i >= 0);
    for (let i = idx.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
    const n = Math.min(idx.length, Math.max(1, Math.round(idx.length * f)));
    idx.slice(0, n).forEach(i => (chars[i] = "_"));
    return { text: chars.join(" "), hidden: n };
  }

  function spawn() {
    const busyLanes = new Set(enemies.filter(e => !e.dead && e.x + e.w > W - 30).map(e => e.lane));
    const free = [...Array(laneCount).keys()].filter(l => !busyLanes.has(l));
    if (!free.length) return;
    const lane = free[(Math.random() * free.length) | 0];
    const [en, vi] = nextWord();
    const m = mask(en, hideFrac());
    ctx.font = "bold 18px monospace"; const w1 = ctx.measureText(m.text).width;
    ctx.font = "13px monospace";      const w2 = ctx.measureText(vi).width;
    enemies.push({ word: en, shown: m.text, vi, hidden: m.hidden, lane, w: Math.max(w1, w2) + 32, x: W + 10, dead: false, targeted: false });
  }

  function muzzle() {
    const L = 78 - cannon.recoil;
    return { x: cannon.x + Math.cos(cannon.angle) * L, y: cannonY() + Math.sin(cannon.angle) * L };
  }
  function center(e) { return { x: e.x + e.w / 2, y: laneY(e.lane) }; }

  function fire(e) {
    e.targeted = true;
    const c = center(e), cy = cannonY();
    cannon.angle = Math.atan2(c.y - cy, c.x - cannon.x);
    cannon.recoil = 14;
    const m = muzzle();
    shots.push({ x: m.x, y: m.y, target: e });
  }
  function explode(e) {
    e.dead = true; kills++;
    score += 10 + e.hidden * 5;
    const c = center(e);
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2), v = rand(60, 240);
      parts.push({ x: c.x, y: c.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.4, .8), max: .8, ch: "*#%@+x"[(Math.random() * 6) | 0] });
    }
    floats.push({ text: e.word, x: c.x, y: c.y, life: 1 });
  }

  function reset() {
    enemies = []; shots = []; parts = []; floats = []; bag = [];
    score = 0; lives = 3; kills = 0; spawnT = 0; introT = 0; shakeT = 0;
    laneCount = Math.max(2, Math.min(5, Math.floor((H - TOP - BOTTOM) / 72)));
    cannon.x = -90; cannon.angle = 0; cannon.recoil = 0;
    overEl.classList.remove("on");
    input.value = "";
    updateInfo();
  }
  function updateInfo() { vocabInfo.textContent = `${vocab.length} words`; }

  function update(dt) {
    if (state === "intro") {
      introT += dt;
      const p = Math.min(introT / 0.9, 1);
      cannon.x = -90 + 160 * easeOut(p);
      if (p >= 1) { state = "play"; spawnT = 0.4; input.focus(); }
    }
    if (state === "play") {
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = Math.max(1.1, 3.4 - 0.18 * (level() - 1)) + rand(0, 0.8); }
      const speed = W * 0.045 + level() * 5;
      const danger = cannon.x + 44;
      for (const e of enemies) {
        if (e.dead) continue;
        e.x -= speed * dt;
        if (e.x <= danger) {
          e.dead = true; lives--; shakeT = 0.35;
          if (lives <= 0) { state = "over"; $("#overScore").textContent = `score ${score} · level ${level()}`; overEl.classList.add("on"); }
        }
      }
      for (const s of shots) {
        if (s.target.dead && !s.hit) { s.gone = true; continue; }
        const c = center(s.target), dx = c.x - s.x, dy = c.y - s.y, d = Math.hypot(dx, dy);
        if (d < 26) { explode(s.target); s.gone = true; }
        else { const v = 1100 * dt; s.x += dx / d * v; s.y += dy / d * v; }
      }
      shots = shots.filter(s => !s.gone);
      enemies = enemies.filter(e => !e.dead || e.x > -e.w);
      enemies = enemies.filter(e => !e.dead);
      // aim at the nearest live enemy when idle
      const live = enemies.filter(e => !e.targeted);
      if (live.length && !shots.length) {
        const e = live.reduce((a, b) => (a.x < b.x ? a : b)), c = center(e);
        const want = Math.atan2(c.y - cannonY(), c.x - cannon.x);
        cannon.angle += (want - cannon.angle) * Math.min(1, 8 * dt);
      }
    }
    cannon.recoil = Math.max(0, cannon.recoil - 50 * dt);
    shakeT = Math.max(0, shakeT - dt);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const f of floats) { f.y -= 30 * dt; f.life -= dt; }
    floats = floats.filter(f => f.life > 0);
    hud.textContent = `SCORE ${score}   LV ${level()}   LIVES ${"♥".repeat(Math.max(lives, 0)) || "-"}`;
  }

  function drawCannon() {
    const cx = cannon.x, cy = cannonY();
    ctx.fillStyle = "#000"; ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
    // barrel
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(cannon.angle);
    ctx.fillRect(-cannon.recoil, -9, 70, 18);
    ctx.fillRect(60 - cannon.recoil, -13, 14, 26);
    ctx.restore();
    // mount + wheel
    ctx.fillRect(cx - 30, cy + 4, 60, 12);
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx, cy + 18, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      ctx.beginPath(); ctx.moveTo(cx, cy + 18); ctx.lineTo(cx + Math.cos(a) * 22, cy + 18 + Math.sin(a) * 22); ctx.stroke();
    }
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(cx, cy + 18, 4, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shakeT > 0) ctx.translate(rand(-5, 5), rand(-5, 5));
    // danger line
    ctx.strokeStyle = "#bbb"; ctx.lineWidth = 1; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(cannon.x + 44, TOP); ctx.lineTo(cannon.x + 44, H - BOTTOM + 20); ctx.stroke();
    ctx.setLineDash([]);
    drawCannon();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const e of enemies) {
      const y = laneY(e.lane) - BLOCK_H / 2;
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000"; ctx.lineWidth = e.targeted ? 3 : 2;
      ctx.fillRect(e.x, y, e.w, BLOCK_H); ctx.strokeRect(e.x, y, e.w, BLOCK_H);
      ctx.fillStyle = "#000"; ctx.font = "bold 18px monospace";
      ctx.fillText(e.shown, e.x + e.w / 2, y + 22);
      ctx.fillStyle = "#555"; ctx.font = "13px monospace";
      ctx.fillText(e.vi, e.x + e.w / 2, y + 43);
    }
    ctx.fillStyle = "#000";
    for (const s of shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill(); }
    ctx.font = "bold 16px monospace";
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillText(p.ch, p.x, p.y); }
    ctx.font = "bold 18px monospace";
    for (const f of floats) { ctx.globalAlpha = Math.max(0, f.life); ctx.fillText(f.text, f.x, f.y - 30); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function loop(t) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min((t - last) / 1000, 0.05); last = t;
    update(dt); draw();
  }

  function startGame() {
    cancelAnimationFrame(raf);
    sizeCanvas(); reset();
    state = "intro"; last = performance.now();
    raf = requestAnimationFrame(loop);
  }
  function stopGame() {
    cancelAnimationFrame(raf); state = "idle";
    overEl.classList.remove("on"); input.blur();
  }

  /* input: auto-fire when typed text exactly matches an enemy word */
  input.addEventListener("input", () => {
    if (state !== "play") return;
    const v = norm(input.value);
    if (!v) return;
    const hit = enemies.filter(e => !e.dead && !e.targeted && norm(e.word) === v)
                       .sort((a, b) => a.x - b.x)[0];
    if (hit) { fire(hit); input.value = ""; }
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && input.value) {
      input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      input.value = "";
    }
  });
  frame.addEventListener("click", () => { if (body.classList.contains("game") && state === "play") input.focus(); });

  /* upload */
  $("#upload").onclick = () => $("#file").click();
  $("#file").onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    const list = parseVocab(await f.text(), f.name);
    ev.target.value = "";
    if (!list.length) { vocabInfo.textContent = "no valid lines (use: english,vietnamese)"; return; }
    vocab = list;
    try { localStorage.setItem("wa_vocab", JSON.stringify(vocab)); } catch (e) {}
    startGame();
  };
  $("#restart").onclick = () => { startGame(); };
  $("#diff").onchange = () => input.focus();

  /* =====================================================
   *  MENU
   * ===================================================== */
  const statusEl = $("#status");
  function enterGame(fn) {
    body.classList.add("game");
    statusEl.textContent = "";
    setTimeout(fn, 760); // wait for the zoom-out
  }
  function leaveGame() {
    stopGame();
    body.classList.remove("game");
    setTimeout(() => { fit(cur); if (arts.length) show(cur); }, 760);
  }
  $("#back").onclick = leaveGame;

  const MODES = [
    { name: "Word Cannon", start: startGame },
    { name: "Word Scramble" }, { name: "Hangman" }, { name: "Typing Race" },
    { name: "Listening Quiz" }, { name: "Sentence Builder" }, { name: "Fill the Blank" }, { name: "Speed Translate" },
  ];
  MODES.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "mode";
    b.innerHTML = `<span>${m.name}</span><span class="idx">${String(i + 1).padStart(2, "0")}</span>`;
    b.onclick = () => m.start ? enterGame(m.start) : (statusEl.textContent = `[${m.name}] — not implemented yet`);
    $("#modes").appendChild(b);
  });
})();
</script>
</body>
</html>
