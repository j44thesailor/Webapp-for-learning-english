<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Arcade — Học Tiếng Anh Qua Trò Chơi</title>
<style>
  :root {
    --bg: #090812;
    --bg-panel: #0e0c1d;
    --bg-card: #15122b;
    --bg-card-hover: #1e1a3d;
    --fg: #f1effc;
    --fg-soft: #c4b5fd;
    --mute: #7c75a8;
    --line: #252044;
    --line-bright: #4c438a;
    --accent: #a78bfa;
    --accent-cyan: #38bdf8;
    --danger: #fb7185;
    --gold: #fbbf24;
    --ease: cubic-bezier(.7, 0, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    display: grid;
    grid-template-columns: 310px 1fr;
    height: 100vh;
    transition: grid-template-columns .7s var(--ease);
    overflow: hidden;
  }
  body.game { grid-template-columns: 0px 1fr; }

  /* LEFT: sidebar menu */
  aside {
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    overflow: hidden;
    min-width: 0;
    transition: opacity .3s, border-color .7s;
  }
  body.game aside { opacity: 0; pointer-events: none; border-right-color: transparent; }
  .aside-in {
    width: 309px;
    padding: 26px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 100%;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    flex-shrink: 0;
  }
  h1 {
    font-size: 18px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .sub {
    font-size: 11px;
    color: var(--mute);
    margin-bottom: 16px;
    padding-left: 19px;
  }
  .sec-label {
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--mute);
    margin: 4px 0 4px 4px;
  }
  #modes { display: flex; flex-direction: column; gap: 7px; }
  .mode {
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
    padding: 11px 14px;
    background: rgba(21, 18, 43, 0.55);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background .16s, border-color .16s, transform .12s, box-shadow .16s;
  }
  .mode:hover, .mode:focus-visible {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(167, 139, 250, 0.16);
    transform: translateX(2px);
    outline: none;
  }
  .mode.ready {
    border-color: rgba(167, 139, 250, 0.38);
  }
  .mode .idx {
    font-size: 11px;
    color: var(--mute);
  }
  .mode.ready .idx {
    color: var(--accent-cyan);
  }
  .mode:hover .idx, .mode:focus-visible .idx { color: var(--fg-soft); }
  .aside-tools {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .menu-upload {
    width: 100%;
    text-align: center;
    font-size: 12px;
  }
  #status {
    padding: 10px 12px;
    font-size: 11px;
    color: var(--fg-soft);
    min-height: 2.6em;
    border-radius: 6px;
    background: rgba(21, 18, 43, 0.4);
    border: 1px solid transparent;
  }
  #status:not(:empty) { border-color: var(--line); }

  /* RIGHT: ASCII galaxy stage & game viewport */
  main {
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    min-height: 0;
    transition: padding .7s var(--ease);
    background: radial-gradient(circle at 60% 45%, #131029 0%, #090812 75%);
  }
  body.game main { padding: 12px; }
  #frame {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    min-height: 0;
    background:
      radial-gradient(ellipse at 52% 48%, rgba(139, 92, 246, 0.14) 0%, rgba(56, 189, 248, 0.04) 36%, rgba(9, 8, 18, 0.96) 76%);
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.65);
  }
  #floatLayer {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
    transition: opacity .4s;
  }
  body.game #floatLayer { opacity: 0; }
  .fword {
    position: absolute;
    top: 0;
    left: 0;
    transform: translate3d(-9999px, -9999px, 0);
    will-change: transform, opacity;
    text-align: center;
    white-space: nowrap;
    user-select: none;
  }
  .fword .en {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--fg-soft);
    text-shadow: 0 0 12px rgba(167, 139, 250, 0.45);
  }
  .fword.cyan .en {
    color: #bae6fd;
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
  }
  .fword .vi {
    display: block;
    font-size: 10.5px;
    color: var(--mute);
    margin-top: 2px;
  }
  #art {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    transform-origin: 0 0;
    font-size: 12px;
    line-height: 1;
    white-space: pre;
    color: #e9e5ff;
    text-shadow: 0 0 10px rgba(167, 139, 250, 0.35), 0 0 24px rgba(56, 189, 248, 0.14);
    user-select: none;
    will-change: transform;
    transition: opacity .4s;
  }
  body.game #art { opacity: 0; }
  #meta {
    font-size: 11px;
    color: var(--mute);
    display: flex;
    justify-content: space-between;
    padding: 0 4px;
  }
  body.game #meta { display: none; }

  /* GAME layer */
  #game {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    visibility: hidden;
    opacity: 0;
  }
  body.game #game { visibility: visible; opacity: 1; transition: opacity .4s .5s; }
  #bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 14px;
    background: linear-gradient(180deg, rgba(9, 8, 18, 0.9) 0%, rgba(9, 8, 18, 0) 100%);
    visibility: hidden;
    opacity: 0;
  }
  body.game #bar, body.game #answer { visibility: visible; opacity: 1; transition: opacity .4s .5s; }
  .grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn, select.btn {
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    background: rgba(21, 18, 43, 0.85);
    color: var(--fg);
    border: 1px solid var(--line-bright);
    border-radius: 7px;
    padding: 7px 12px;
    backdrop-filter: blur(6px);
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  .btn:hover, .btn:focus-visible, .btn.on {
    background: rgba(167, 139, 250, 0.22);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 14px rgba(167, 139, 250, 0.25);
    outline: none;
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: default;
    box-shadow: none;
  }
  select.btn option {
    background: #141129;
    color: var(--fg);
  }
  #hud {
    font-size: 12px;
    letter-spacing: .05em;
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(21, 18, 43, 0.8);
    border: 1px solid var(--line);
    color: var(--fg);
  }
  #vocabInfo { font-size: 11px; color: var(--mute); }

  #answer {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    width: min(460px, 86%);
    padding: 13px 18px;
    font: inherit;
    font-size: 16px;
    text-align: center;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    background: rgba(16, 14, 34, 0.92);
    color: #fff;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(167, 139, 250, 0.2);
    backdrop-filter: blur(8px);
    outline: none;
    visibility: hidden;
    opacity: 0;
  }
  #answer::placeholder { color: var(--mute); font-size: 13px; }
  #answer:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(56, 189, 248, 0.28);
  }
  #answer.shake { animation: shake .3s; border-color: var(--danger); }
  @keyframes shake {
    20%{transform:translateX(calc(-50% - 8px))}
    40%{transform:translateX(calc(-50% + 8px))}
    60%{transform:translateX(calc(-50% - 5px))}
    80%{transform:translateX(calc(-50% + 5px))}
  }

  /* overlay: shop / workshop / game over */
  #ov {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    background: rgba(9, 8, 18, 0.88);
    backdrop-filter: blur(12px);
    overflow-y: auto;
  }
  #ov.on { display: block; }
  #ovBody {
    width: min(680px, 94%);
    margin: 0 auto;
    padding: 64px 0 44px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #ovBody h2 {
    font-size: 21px;
    letter-spacing: .1em;
    color: var(--fg);
  }
  #ovBody h3 {
    font-size: 11px;
    letter-spacing: .14em;
    margin-top: 14px;
    color: var(--accent);
    font-weight: normal;
  }
  #ovBody .m {
    font-size: 12.5px;
    color: var(--fg-soft);
    line-height: 1.75;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    cursor: pointer;
    padding: 13px 16px;
    background: var(--bg-card);
    color: var(--fg);
    border: 1px solid var(--line-bright);
    border-radius: 9px;
    transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
  }
  .opt .r {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    gap: 12px;
  }
  .opt .r span { color: var(--accent-cyan); font-size: 12px; }
  .opt .d { font-size: 11.5px; color: var(--mute); margin-top: 5px; }
  .opt:hover:not(:disabled) {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(167, 139, 250, 0.18);
    transform: translateY(-1px);
  }
  .opt:hover:not(:disabled) .d { color: var(--fg-soft); }
  .opt:disabled {
    opacity: 0.45;
    border-color: var(--line);
    cursor: default;
  }
  .opt.free {
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(251, 191, 36, 0.14);
  }
  .opt.free .r span { color: var(--gold); font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Sổ Tử Huyệt Hậu Trận */
  .weak-box {
    background: rgba(21, 18, 43, 0.72);
    border: 1px solid rgba(251, 113, 133, 0.35);
    border-radius: 9px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
  }
  .weak-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-bottom: 7px;
    border-bottom: 1px solid rgba(37, 32, 68, 0.8);
    font-size: 12px;
  }
  .weak-item:last-child { border-bottom: none; padding-bottom: 0; }
  .weak-word { color: #f8fafc; font-weight: 600; }
  .weak-vi { color: var(--fg-soft); margin-left: 6px; }
  .weak-cnt { color: var(--danger); font-size: 11px; margin-left: 6px; }
  .btn-xs {
    font: inherit;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    background: rgba(56, 189, 248, 0.14);
    color: #bae6fd;
    border: 1px solid rgba(56, 189, 248, 0.4);
  }
  .btn-xs:hover {
    background: rgba(56, 189, 248, 0.28);
    color: #fff;
  }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; overflow: auto; }
    body.game { grid-template-columns: 1fr; grid-template-rows: 0px 1fr; height: 100vh; overflow: hidden; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .aside-in { width: auto; }
    main { height: 70vh; }
    body.game main { height: auto; }
  }
</style>
</head>
<body>

<aside>
  <div class="aside-in">
    <div class="brand"><span class="brand-dot"></span><h1>Word Arcade</h1></div>
    <div class="sub">học tiếng anh qua trò chơi</div>
    <div class="sec-label">Chế độ chơi</div>
    <div id="modes"></div>
    <div class="aside-tools">
      <button class="btn menu-upload" id="menuUpload">+ Nạp file từ vựng</button>
      <div id="status"></div>
    </div>
  </div>
</aside>

<main>
  <div id="frame">
    <div id="floatLayer"></div>
    <pre id="art"></pre>
    <canvas id="game"></canvas>

    <div id="bar">
      <div class="grp">
        <button class="btn" id="back">&larr; Menu</button>
        <button class="btn" id="workshop">Xưởng Nâng Cấp</button>
      </div>
      <div id="hud"></div>
      <div class="grp">
        <span id="vocabInfo"></span>
        <select class="btn" id="diff" title="Độ khó khởi đầu (tăng nhẹ sau mỗi đợt)">
          <option value="han" selected>Độ khó: Hân</option>
          <option value="easy">Độ khó: Dễ</option>
          <option value="medium">Độ khó: Vừa</option>
          <option value="hard">Độ khó: Khó</option>
        </select>
        <button class="btn" id="upload">Nạp từ vựng</button>
        <input type="file" id="file" accept=".txt,.csv,.tsv,.json,text/plain" hidden>
      </div>
    </div>

    <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gõ từ tiếng anh tương ứng...">

    <div id="ov"><div id="ovBody"></div></div>
  </div>
  <div id="meta"><span id="counter"></span><span id="vocabMeta"></span></div>
</main>

<script src="arts.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const body = document.body;
  const frame = $("#frame");

  /* =====================================================
   *  ASCII DISPLAY (static Art 2 only)
   * ===================================================== */
  const MAX_SCALE = 4;
  const pre = $("#art"), counter = $("#counter"), vocabMeta = $("#vocabMeta");
  const arts = window.ARTS || [];
  const artText = arts[1] || arts[0] || "";
  let artDim = null;
  let artBox = { left: 0, right: 0, width: 0, height: 0 };

  function measureArt() {
    if (!artText) return;
    pre.style.transform = "none";
    pre.textContent = artText;
    artDim = { w: pre.offsetWidth, h: pre.offsetHeight };
  }
  function fitArt() {
    if (!artDim) return;
    const { w, h } = artDim, pad = 20;
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const s = Math.min((fw - pad * 2) / w, (fh - pad * 2) / h, MAX_SCALE);
    const rw = w * s, rh = h * s;
    const x = (fw - rw) / 2, y = (fh - rh) / 2;
    pre.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    artBox = { left: x, right: x + rw, width: rw, height: rh };
  }
  if (artText) {
    measureArt();
    fitArt();
    counter.textContent = arts[1] ? "tác phẩm 02" : "tác phẩm 01";
  } else {
    pre.textContent = "Không tìm thấy ASCII art trong arts.js";
  }

  /* =====================================================
   *  VOCAB & FLOATING IMPORTED WORDS ON MENU
   * ===================================================== */
  const DEFAULT_VOCAB = [
    ["apple","quả táo"],["knowledge","kiến thức"],["journey","hành trình"],["ancient","cổ xưa"],
    ["borrow","mượn"],["challenge","thử thách"],["delicious","ngon"],["environment","môi trường"],
    ["freedom","sự tự do"],["generous","hào phóng"],["honest","trung thực"],["improve","cải thiện"],
    ["knowledge base","cơ sở tri thức"],["lecture","bài giảng"],["mountain","ngọn núi"],["neighbor","hàng xóm"],
    ["opinion","ý kiến"],["patient","kiên nhẫn"],["quarrel","cãi nhau"],["reliable","đáng tin cậy"],
    ["suggest","gợi ý"],["tremendous","to lớn"],["unusual","khác thường"],["vacation","kỳ nghỉ"],
    ["wisdom","sự thông thái"],["yesterday","hôm qua"],["abandon","từ bỏ"],["brilliant","xuất sắc"],
    ["curious","tò mò"],["essential","thiết yếu"],
  ];
  let vocab = DEFAULT_VOCAB.slice();
  let importedVocab = [];
  try {
    const saved = JSON.parse(localStorage.getItem("wa_vocab") || "null");
    if (Array.isArray(saved) && saved.length) {
      vocab = saved;
      importedVocab = saved.slice();
    }
  } catch (e) {}

  function updateVocabMeta() {
    vocabMeta.textContent = importedVocab.length
      ? `bộ từ đã nạp: ${importedVocab.length} từ`
      : `bộ từ mặc định: ${vocab.length} từ`;
  }
  updateVocabMeta();

  /* ---- Floating words on left & right sides of Art 2 ---- */
  const floatLayer = $("#floatLayer");
  let floatItems = [];
  let floatBag = [];
  let floatSpawnT = 0;
  let floatLast = performance.now();
  let floatSideToggle = 0;

  function nextFloatPair() {
    if (!importedVocab.length) return null;
    if (!floatBag.length) {
      floatBag = importedVocab.map((_, i) => i);
      for (let i = floatBag.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [floatBag[i], floatBag[j]] = [floatBag[j], floatBag[i]];
      }
    }
    return importedVocab[floatBag.pop()];
  }

  function clearFloatingWords() {
    floatItems.forEach(it => it.el.remove());
    floatItems = [];
    floatBag = [];
    floatSpawnT = 0;
  }

  function pickSideX(side, elW) {
    const fw = frame.clientWidth;
    const pad = 14;
    if (side === "left") {
      const maxR = Math.max(pad + 60, artBox.left - 14);
      const minL = pad;
      const span = Math.max(0, maxR - minL - elW);
      return minL + Math.random() * span;
    } else {
      const minL = Math.min(fw - pad - 60, artBox.right + 14);
      const maxR = fw - pad;
      const span = Math.max(0, maxR - minL - elW);
      return minL + Math.random() * span;
    }
  }

  function spawnFloatingWord(initialY) {
    const pair = nextFloatPair();
    if (!pair) return;
    const fw = frame.clientWidth, fh = frame.clientHeight;
    if (!fw || !fh) return;

    const side = (floatSideToggle++ % 2 === 0) ? "left" : "right";
    const el = document.createElement("div");
    el.className = "fword" + (Math.random() < 0.45 ? " cyan" : "");

    const enSpan = document.createElement("span");
    enSpan.className = "en";
    enSpan.textContent = pair[0];

    const viSpan = document.createElement("span");
    viSpan.className = "vi";
    viSpan.textContent = pair[1];

    el.appendChild(enSpan);
    el.appendChild(viSpan);
    floatLayer.appendChild(el);

    const elW = el.offsetWidth || 80;
    const elH = el.offsetHeight || 30;
    const baseX = pickSideX(side, elW);
    const y = typeof initialY === "number" ? initialY : fh + elH + Math.random() * 24;

    floatItems.push({
      el, side, baseX, y, h: elH,
      vy: 20 + Math.random() * 18,
      amp: 5 + Math.random() * 8,
      freq: 0.7 + Math.random() * 0.8,
      phase: Math.random() * Math.PI * 2,
      maxAlpha: 0.55 + Math.random() * 0.35,
      t: 0,
    });
  }

  function seedFloatingWords() {
    clearFloatingWords();
    if (!importedVocab.length) return;
    const fh = frame.clientHeight || 600;
    const count = Math.min(18, Math.max(8, importedVocab.length));
    for (let i = 0; i < count; i++) {
      const y = (fh * (i + 0.5)) / count;
      spawnFloatingWord(y);
    }
  }

  function tickFloatingWords(now) {
    requestAnimationFrame(tickFloatingWords);
    const dt = Math.min((now - floatLast) / 1000, 0.05);
    floatLast = now;

    if (!importedVocab.length || body.classList.contains("game")) return;

    const fh = frame.clientHeight;
    const targetCount = Math.min(20, Math.max(10, importedVocab.length));
    floatSpawnT -= dt;
    if (floatItems.length < targetCount && floatSpawnT <= 0) {
      spawnFloatingWord();
      floatSpawnT = 0.65 + Math.random() * 0.5;
    }

    for (let i = floatItems.length - 1; i >= 0; i--) {
      const it = floatItems[i];
      it.t += dt;
      it.y -= it.vy * dt;
      const sway = Math.sin(it.t * it.freq + it.phase) * it.amp;
      const x = it.baseX + sway;

      const fadeIn = Math.min(1, Math.max(0, (fh - it.y) / 90));
      const fadeOut = Math.min(1, Math.max(0, (it.y + it.h) / 110));

      it.el.style.opacity = alpha.toFixed(3);

  function parseVocab(text, filename) {
    text = text.replace(/^\uFEFF/, "");
    const out = [];
    const push = (en, vi) => {
      en = String(en ?? "").trim().replace(/^["']|["']$/g, "").trim();
      vi = String(vi ?? "").trim().replace(/^["']|["']$/g, "").trim();
      if (!en || !vi) return;
      if (["english", "en", "word"].includes(en.toLowerCase()) && out.length === 0) return;
      out.push([en, vi]);
    };
    const t = text.trim();
    if (/\.json$/i.test(filename) || t[0] === "[" || t[0] === "{") {
      try {
        const j = JSON.parse(t);
        if (Array.isArray(j)) j.forEach(it => {
          if (Array.isArray(it)) push(it[0], it[1]);
          else if (it && typeof it === "object")
            push(it.en ?? it.english ?? it.word, it.vi ?? it.vietnamese ?? it.meaning);
        });
        else if (j && typeof j === "object") Object.entries(j).forEach(([k, v]) => push(k, v));
        return out;
      } catch (e) {}
    }
    for (const raw of t.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      let idx = -1, len = 1;
      for (const d of ["\t", "|", ";", " - ", " – ", " — ", "=", ",", ":"]) {
        const k = line.indexOf(d);
        if (k > 0) { idx = k; len = d.length; break; }
      }
      if (idx > 0) push(line.slice(0, idx), line.slice(idx + len));
    }
    return out;
  }

  /* =====================================================
   *  WEB SPEECH API (Natural Voice Selection + Manual Tab Trigger)
   * ===================================================== */
  let bestEnVoice = null;
  function pickBestEnglishVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;

    const preferredPatterns = [
      /Microsoft Aria Online.*Natural/i,
      /Microsoft Jenny Online.*Natural/i,
      /Microsoft Guy Online.*Natural/i,
      /Microsoft Ava Online.*Natural/i,
      /Google US English/i,
      /Google UK English Female/i,
      /Samantha/i,
      /Karen/i,
      /Daniel/i,
      /Microsoft Zira/i,
      /Microsoft David/i,
    ];

    for (const pat of preferredPatterns) {
      const match = voices.find(v => pat.test(v.name));
      if (match) return match;
    }
    return (
      voices.find(v => /^en[-_]US$/i.test(v.lang) && /natural|neural|google|premium/i.test(v.name)) ||
      voices.find(v => /^en[-_]US$/i.test(v.lang)) ||
      voices.find(v => /^en/i.test(v.lang)) ||
      null
    );
  }

  if ("speechSynthesis" in window) {

    if (!word || !("speechSynthesis" in window)) return;
    try {

      const u = new SpeechSynthesisUtterance(word);
      if (bestEnVoice) {
        u.voice = bestEnVoice;
        u.lang = bestEnVoice.lang || "en-US";
      } else {
        u.lang = "en-US";
      }
      u.rate = slow ? 0.82 : 0.94;
      u.pitch = 1.02;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---- Weak words tracking (Sổ Tử Huyệt + Radar Từ Yếu) ---- */
  function recordWeakWord(en, vi) {
    if (!R || !en) return;
    const key = norm(en);
    if (!R.weakMap[key]) {
      const found = vocab.find(v => norm(v[0]) === key);
      R.weakMap[key] = { en: found ? found[0] : en, vi: vi || (found ? found[1] : ""), count: 0 };
    }
    R.weakMap[key].count++;
  }
  const isWeakKey = en => !!(R && R.weakMap[norm(en)]);

  function nextWord(opts = {}) {
    // Cơ chế lặp lại từ yếu tích hợp sẵn: ưu tiên bốc lại từ từng gõ sai/lọt
    if (R) {
      const weakKeys = Object.keys(R.weakMap);
      if (weakKeys.length && Math.random() < 0.40) {
        const k = weakKeys[(Math.random() * weakKeys.length) | 0];
        const w = R.weakMap[k];
        if (w) return [w.en, w.vi];
      }
    }

    if (opts.preferLong) {
      const longWords = vocab.filter(([en]) => en.replace(/\s+/g, "").length >= 7);
      if (longWords.length) return longWords[(Math.random() * longWords.length) | 0];
    }
    if (opts.preferShort) {
      const shortWords = vocab.filter(([en]) => en.replace(/\s+/g, "").length <= 6);
      if (shortWords.length) return shortWords[(Math.random() * shortWords.length) | 0];
    }

    if (!bag.length) {
      bag = vocab.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [bag[i], bag[j]] = [bag[j], bag[i]]; }
    }
    return vocab[bag.pop()];
  }

  function mask(word) {
    const chars = [...word];
    const allAlpha = chars.map((c, i) => (/[\p{L}\d]/u.test(c) ? i : -1)).filter(i => i >= 0);
    let idx = allAlpha.slice();

    // Định Vị Đầu – Đuôi (nâng cấp bằng mảnh tinh thể): giữ lộ chữ cái đầu và cuối
    if (meta.unlocked.boundary && idx.length >= 3) {
      idx = idx.slice(1, -1);
    }

    for (let i = idx.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
    let n = Math.max(1, Math.round(allAlpha.length * hideFrac()));
    n = Math.min(idx.length, Math.max(idx.length > 0 ? 1 : 0, n - R.upg.reveal));
    const order = idx.slice(0, n);
    order.forEach(i => (chars[i] = "_"));
    return { text: chars.join(" "), hidden: n, order };
  }

  function hint(e, dt, customStart) {
    if (e.flash > 0) e.flash -= dt;

    const build = ri => { const a = [...e.orig]; e.order.forEach(i => { if (i !== ri) a[i] = "_"; }); return a.join(" "); };
    const start = typeof customStart === "number" ? customStart : (cannon.x + 44 + hintZoneWidth(e.weak));
    if (e.x < start) {
      if (!e.inZone) {
        e.inZone = true; e.hintT = 0; e.flash = 0.35;
      }
      e.hintT += dt;
      const frames = n === 1 ? 2 : n;
      const step = Math.floor(e.hintT / HINT_STEP) % frames;
      if (step !== e.step) { e.step = step; e.shown = build(step < n ? e.order[step] : -1); }

      score: 0, kills: 0, coins: 15 * perk("seed"), earned: 0,
      lives: 3 + perk("life"), streak: 0, maxStreak: 0,
      upg: { slow: 0, reveal: 0, armor: 0, turret: 0 },
      curse: null, nextCurse: null, turretT: 4,
      draft: [], rerolls: 0, awarded: false, gain: 0,
      weakMap: {}, freePick: false,
    };
    enemies = []; boss = null; shots = []; parts = []; floats = []; bag = [];
    shakeT = 0; introT = 0;
    laneCount = Math.max(2, Math.min(5, Math.floor((H - TOP - BOTTOM) / 76)));
    cannon.x = -90; cannon.angle = 0; cannon.recoil = 0;
    input.value = "";
    vocabInfo.textContent = `${vocab.length} từ`;
  }

  /* ---- run end / shards ---- */
  function awardShards() {
    if (!R || R.awarded) return;
    R.awarded = true;
    R.gain = Math.floor(R.earned * 0.25) + 8 * (R.wave - 1) + Math.floor(R.kills / 10);
    meta.shards += R.gain;
    meta.bestScore = Math.max(meta.bestScore, R.score);
    meta.bestWave = Math.max(meta.bestWave, R.wave);
    saveMeta();
  }
  function gameOver() { state = "over"; awardShards(); input.blur(); showOv("over"); }

  /* ---- overlay rendering ---- */
  const opt = (attr, title, right, desc, off, extraCls = "") =>
    `<button class="opt ${extraCls}" ${attr} ${off ? "disabled" : ""}><div class="r"><b>${title}</b><span>${right}</span></div><div class="d">${desc}</div></button>`;

  function poolIds() {
    return Object.keys(UPG).filter(id => (!UPG[id].meta || meta.unlocked[UPG[id].meta]) && R.upg[id] < UPG[id].max);
  }
  function pickOne(exclude) {
    const p = poolIds().filter(id => !exclude.includes(id));
    return p.length ? p[(Math.random() * p.length) | 0] : null;
  }
  function rollDraft() {
    const d = [];
    for (let i = 0; i < 3; i++) { const id = pickOne(d); if (id) d.push(id); }
    return d;
  }
  const rerollCost = () => 10 + 5 * R.rerolls;

  function workshopHTML() {
    let h = `<h3>XƯỞNG NÂNG CẤP — mảnh tinh thể: ${meta.shards}</h3>`;
    for (const it of META_ITEMS) {
      if (it.kind === "unlock") {
        const owned = !!meta.unlocked[it.id];
        h += opt(`data-act="meta" data-id="${it.id}"`, it.name, owned ? "đã sở hữu" : `${it.cost} mảnh`, it.desc, owned || meta.shards < it.cost);
      } else {
        const lv = perk(it.id), maxed = lv >= it.max, cost = it.costs[lv];
        h += opt(`data-act="meta" data-id="${it.id}"`, `${it.name} (Cấp ${lv}/${it.max})`, maxed ? "tối đa" : `${cost} mảnh`, it.desc, maxed || meta.shards < cost);
      }
    }
    return h;
  }

  function weakBookHTML() {
    const list = Object.values(R.weakMap).sort((a, b) => b.count - a.count);
    let h = `<h3>SỔ TỬ HUYỆT HẬU TRẬN (${list.length} từ cần ôn lại)</h3>`;
    if (!list.length) {
      h += `<div class="m">Tuyệt vời! Lượt này mày không gõ sai hay để lọt từ nào.</div>`;
      return h;
    }
    h += `<div class="weak-box">` + list.map(it =>
      `<div class="weak-item">
        <div><span class="weak-word">${it.en}</span><span class="weak-vi">— ${it.vi}</span><span class="weak-cnt">(sai/lọt ${it.count} lần)</span></div>
        <button class="btn-xs" data-act="speak" data-word="${it.en.replace(/"/g, "&quot;")}">🔊 Nghe</button>
      </div>`
    ).join("") + `</div>
    <div class="row"><button class="btn" data-act="exportWeak">⬇ Tải file từ yếu để ôn riêng (.txt)</button></div>`;
    return h;
  }

  function renderOv() {
    if (ovKind === "shop") {
      const nextIsBoss = isBossWave(R.wave + 1);
      let h = `<h2>HOÀN THÀNH ĐỢT ${R.wave}${R.freePick ? " — THƯỞNG HẠ BOSS" : ""}</h2>
        <div class="m">xu: <b>${R.coins}</b> &nbsp;·&nbsp; điểm: <b>${R.score}</b> &nbsp;·&nbsp; mạng: <b>${R.lives}</b> &nbsp;·&nbsp; chuỗi cao nhất: <b>${R.maxStreak}</b></div>` +
        (R.freePick ? `<div class="m" style="color:var(--gold)">★ Chiến lợi phẩm Boss: Chọn miễn phí 1 nâng cấp đầu tiên (0 xu)!</div>` : "") +
        `<h3>NÂNG CẤP TRONG TRẬN &nbsp;[1] [2] [3]</h3>`;
      if (!R.draft.length) h += `<div class="m">đã nâng cấp tối đa tất cả kỹ năng.</div>`;
      R.draft.forEach((id, i) => {
        const u = UPG[id], lv = R.upg[id], cost = R.freePick ? 0 : u.cost(lv);
        h += opt(
          `data-act="buy" data-i="${i}"`,
          `[${i + 1}] ${u.name}  (Cấp ${lv} → ${lv + 1})`,
          R.freePick ? "MIỄN PHÍ (0 xu)" : `${cost} xu`,
          u.desc,
          R.coins < cost,
          R.freePick ? "free" : ""
        );
      });
      h += `<div class="row"><button class="btn" data-act="reroll" ${R.coins < rerollCost() ? "disabled" : ""}>[R] Đổi danh sách — ${rerollCost()} xu</button></div>`;
      if (meta.unlocked.curses && !nextIsBoss) {
        h += `<h3>LỜI NGUYỀN CHO ĐỢT SAU (xu x${CURSE_COIN_MULT}) &nbsp;[C]</h3><div class="row">
          <button class="btn ${!R.nextCurse ? "on" : ""}" data-act="curse" data-v="">Không dùng</button>` +
          Object.entries(CURSES).map(([k, c]) => `<button class="btn ${R.nextCurse === k ? "on" : ""}" data-act="curse" data-v="${k}" title="${c.desc}">${c.name} — ${c.desc}</button>`).join("") + `</div>`;
      }
      h += `<h3></h3><button class="opt" data-act="start"><div class="r"><b>[Enter] ${nextIsBoss ? `Đối đầu BOSS Đợt ${R.wave + 1}` : `Bắt đầu đợt ${R.wave + 1}`}</b><span>${nextIsBoss ? "Trùm từ vựng xuất hiện" : `${toSpawnFor(R.wave + 1)} từ vựng`}</span></div></button>`;
      ovBody.innerHTML = h;
    } else if (ovKind === "over") {
      ovBody.innerHTML = `<h2>KẾT THÚC</h2>
        <div class="m">đợt: <b>${R.wave}</b> &nbsp;·&nbsp; điểm: <b>${R.score}</b> &nbsp;·&nbsp; bắn hạ: <b>${R.kills}</b> từ &nbsp;·&nbsp; chuỗi cao nhất: <b>${R.maxStreak}</b><br>
        xu kiếm được: ${R.earned} &nbsp;→&nbsp; <b>+${R.gain} mảnh tinh thể</b><br>
        kỷ lục cá nhân: đợt ${meta.bestWave}, điểm ${meta.bestScore}</div>
        ${weakBookHTML()}
        ${workshopHTML()}
        <h3></h3><button class="opt" data-act="restart"><div class="r"><b>Chơi lại từ đầu</b><span></span></div></button>`;
    } else if (ovKind === "workshop") {
      ovBody.innerHTML = `<h2>TẠM DỪNG</h2>${workshopHTML()}<h3></h3><button class="opt" data-act="resume"><div class="r"><b>Tiếp tục chơi</b><span></span></div></button>`;
    }
  }
  function showOv(kind) { ovKind = kind; renderOv(); ov.classList.add("on"); ov.scrollTop = 0; }
  function hideOv() { ovKind = null; ov.classList.remove("on"); }

  /* ---- shop actions ---- */
  function buy(i) {
    const id = R.draft[i]; if (!id) return;
    const u = UPG[id], cost = R.freePick ? 0 : u.cost(R.upg[id]);
    if (R.coins < cost) return;
    R.coins -= cost; R.upg[id]++;
    if (R.freePick) R.freePick = false;
    if (id === "armor") R.lives++;
    const others = R.draft.filter((_, k) => k !== i);
    const repl = pickOne(others);
    if (repl) R.draft[i] = repl; else R.draft.splice(i, 1);
    renderOv();
  }
  function reroll() {
    if (R.coins < rerollCost()) return;
    R.coins -= rerollCost(); R.rerolls++;
    R.draft = rollDraft(); renderOv();
  }
  function startNextWave() {
    R.wave++;
    R.toSpawn = toSpawnFor(R.wave);
    R.spawned = 0;
    R.curse = isBossWave(R.wave) ? null : R.nextCurse;
    R.nextCurse = null;
    R.banner = 2.2;
    R.spawnT = 1.2;
    R.turretT = 3;
    boss = null;
    hideOv(); state = "play"; input.focus();
  }
  function openShop() {
    state = "shop"; R.curse = null; R.nextCurse = null; R.rerolls = 0;
    R.draft = rollDraft(); input.blur(); showOv("shop");
  }

  ov.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === "buy") buy(+b.dataset.i);
    else if (a === "reroll") reroll();
    else if (a === "curse") { R.nextCurse = b.dataset.v || null; renderOv(); }
    else if (a === "start") startNextWave();
    else if (a === "restart") startGame();
    else if (a === "resume") { hideOv(); state = prevState; input.focus(); }
    else if (a === "speak") { speakWord(b.dataset.word, true); }
    else if (a === "exportWeak") {
      const list = Object.values(R.weakMap);
      if (!list.length) return;
      const content = list.map(it => `${it.en}, ${it.vi}`).join("\n");
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `tu-yeu-dot-${R.wave}.txt`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    else if (a === "meta") {
      const it = META_ITEMS.find(x => x.id === b.dataset.id);
      const cost = it.kind === "unlock" ? it.cost : it.costs[perk(it.id)];
      if (meta.shards >= cost) {
        meta.shards -= cost;
        if (it.kind === "unlock") meta.unlocked[it.id] = true; else meta.perks[it.id] = perk(it.id) + 1;
        saveMeta(); renderOv();
      }
    }
    if (document.activeElement && document.activeElement !== input) document.activeElement.blur();
  });

  document.addEventListener("keydown", e => {
    if (ovKind === "shop") {
      const k = e.key.toLowerCase();
      if (k === "1" || k === "2" || k === "3") buy(+k - 1);
      else if (k === "r") reroll();
      else if (k === "c" && meta.unlocked.curses && !isBossWave(R.wave + 1)) { const o = ["", "swift", "fog"]; R.nextCurse = o[(o.indexOf(R.nextCurse || "") + 1) % 3] || null; renderOv(); }
      else if (k === "enter" || k === " ") startNextWave();
      else return;
      e.preventDefault();
      return;
    }
    // Phím Tab luôn đọc lại chậm rõ từ gần nhất
    if (e.key === "Tab" && state === "play") {
      e.preventDefault();
      const frontEnemy = enemies.filter(en => !en.dead && !en.targeted).sort((a, b) => a.x - b.x)[0];
      const targetWord = frontEnemy ? frontEnemy.word : (boss ? boss.word : "");
      if (targetWord) speakWord(targetWord, true);
    }
  });

  /* ---- update / draw ---- */
  function update(dt) {
    if (state === "intro") {
      introT += dt;
      const p = Math.min(introT / 0.9, 1);
      cannon.x = -90 + 160 * easeOut(p);
      if (p >= 1) { state = "play"; input.focus(); }
    }
    if (state === "play") {
      R.banner = Math.max(0, R.banner - dt);
      const danger = cannon.x + 44;

      if (isBossWave(R.wave)) {
        if (R.banner < 1 && R.spawned < 1 && !boss) {
          spawnBoss();
          R.spawned = 1;
        }
        if (boss && boss.hp > 0) {
          boss.hurtT = Math.max(0, boss.hurtT - dt);
          boss.slowT = Math.max(0, boss.slowT - dt);
          const bossSpeed = speedNow() * 0.24 * (boss.slowT > 0 ? 0.35 : 1);
          boss.x -= bossSpeed * dt;
          hint(boss, dt);

          // Boss launches short interference missiles periodically
          boss.missileT -= dt;
          if (boss.missileT <= 0 && boss.x < W - 40) {
            const count = boss.tier >= 2 ? 2 : 1;
            for (let m = 0; m < count; m++) {
              spawn({ preferShort: true, isMissile: true, startX: boss.x + 12 });
            }
            boss.missileT = Math.max(3.2, 5.2 - 0.35 * boss.tier);
          }

          // Boss reaches red line => instant Game Over
          if (boss.x <= danger) {
            recordWeakWord(boss.word, boss.vi);
            R.lives = 0;
            shakeT = 0.5;
            gameOver();
          }
        }
      } else {
        if (R.banner < 1 && R.spawned < R.toSpawn) {
          R.spawnT -= dt;
          if (R.spawnT <= 0) { if (spawn()) { R.spawned++; R.spawnT = spawnGap(); } else R.spawnT = 0.3; }
        }
      }

      if (state === "play") {
        const speed = speedNow();
        for (const e of enemies) {
          if (e.dead) continue;
          const mult = e.isMissile ? 1.15 : 1;
          e.x -= speed * mult * dt;
          hint(e, dt);
          if (e.x <= danger) {
            recordWeakWord(e.word, e.vi);
            e.dead = true; R.lives--; R.streak = 0; shakeT = 0.35;
            if (R.lives <= 0) { gameOver(); break; }
          }
        }
      }

      if (state === "play") {
        if (R.upg.turret > 0) {
          R.turretT -= dt;
          if (R.turretT <= 0) { if (fireTurret()) R.turretT = Math.max(2.5, 8 - 1.3 * R.upg.turret); else R.turretT = 0.5; }
        }
        for (const s of shots) {
          if (s.target === boss) {
            if (!boss || boss.hp <= 0) { s.gone = true; continue; }
            const c = center(boss), dx = c.x - s.x, dy = c.y - s.y, d = Math.hypot(dx, dy);
            if (d < 34) {
              if (s.kind === "main") hitBoss();
              else {
                boss.slowT = 1.2;
                boss.x = Math.min(W - boss.w * 0.45, boss.x + W * 0.015);
              }
              s.gone = true;
            } else { const v = (s.kind === "main" ? 1150 : 850) * dt; s.x += dx / d * v; s.y += dy / d * v; }
          } else {
            if (s.target.dead) { s.gone = true; continue; }
            const c = center(s.target), dx = c.x - s.x, dy = c.y - s.y, d = Math.hypot(dx, dy);
            if (d < 26) {
              if (s.kind === "main") explode(s.target, false);
              else {
                s.target.x = Math.min(W + 30, s.target.x + W * 0.07); s.target.hits++;
                if (s.target.hits >= TURRET_HITS) explode(s.target, true);
              }
              s.gone = true;
            } else { const v = (s.kind === "main" ? 1150 : 850) * dt; s.x += dx / d * v; s.y += dy / d * v; }
          }
        }
        shots = shots.filter(s => !s.gone);
        enemies = enemies.filter(e => !e.dead);

        const live = enemies.filter(e => !e.targeted);
        if (!shots.some(s => s.kind === "main")) {
          const aimTarget = live.length
            ? live.reduce((a, b) => (a.x < b.x ? a : b))
            : (boss && boss.hp > 0 ? boss : null);
          if (aimTarget) {
            const c = center(aimTarget);
            const want = Math.atan2(c.y - cannonY(), c.x - cannon.x);
            cannon.angle += (want - cannon.angle) * Math.min(1, 8 * dt);
          }
        }

        if (!isBossWave(R.wave) && R.spawned >= R.toSpawn && !enemies.length && R.banner <= 0) {
          openShop();
        }
      }
    }
    if (state !== "paused") {
      cannon.recoil = Math.max(0, cannon.recoil - 50 * dt);
      shakeT = Math.max(0, shakeT - dt);
      for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
      for (const f of floats) { f.y -= 30 * dt; f.life -= dt; }
      floats = floats.filter(f => f.life > 0);
    }
    const cm = comboMult(R.streak);
    hud.textContent =
      `ĐỢT ${R.wave}${isBossWave(R.wave) ? " [BOSS]" : ""} · ĐIỂM ${R.score} · XU ${R.coins} · ${"♥".repeat(Math.max(R.lives, 0)) || "-"}` +
      (R.streak >= 3 ? ` · CHUỖI x${cm} (${R.streak})` : "") + (R.curse ? ` · [${CURSES[R.curse].name}]` : "");
    input.placeholder = "gõ từ tiếng anh... (bấm [Tab] để nghe phát âm)";
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCannon() {
    const cx = cannon.x, cy = cannonY();
    ctx.save();
    ctx.shadowColor = "rgba(167, 139, 250, 0.45)";
    ctx.shadowBlur = 14;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(cannon.angle);
    ctx.fillStyle = "#1e1a3d";
    ctx.strokeStyle = "#a78bfa";
    ctx.lineWidth = 2;
    roundRect(-cannon.recoil, -9, 70, 18, 4);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#a78bfa";
    roundRect(58 - cannon.recoil, -12, 14, 24, 3);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#15122b";
    ctx.strokeStyle = "#a78bfa";
    ctx.lineWidth = 2;
    roundRect(cx - 30, cy + 4, 60, 12, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#0e0c1d";
    ctx.beginPath();
    ctx.arc(cx, cy + 18, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#6d5cae";
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(cx, cy + 18);
      ctx.lineTo(cx + Math.cos(a) * 20, cy + 18 + Math.sin(a) * 20);
      ctx.stroke();
    }
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(cx, cy + 18, 4.5, 0, Math.PI * 2);
    ctx.fill();

    if (R.upg.turret > 0) {
      ctx.save();
      ctx.translate(cx, cy - 22);
      ctx.rotate(cannon.tAngle);
      ctx.fillStyle = "#38bdf8";
      roundRect(0, -3, 30, 6, 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#15122b";
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy - 22, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBoss() {
    if (!boss || boss.hp <= 0) return;
    const { x, y, w, h } = boss;
    ctx.save();
    ctx.shadowColor = boss.hurtT > 0 ? "rgba(251, 191, 36, 0.7)" : "rgba(251, 113, 133, 0.45)";
    ctx.shadowBlur = 22;

    // Outer hull
    ctx.fillStyle = boss.hurtT > 0 ? "rgba(55, 22, 46, 0.95)" : "rgba(22, 14, 38, 0.95)";
    ctx.strokeStyle = boss.hurtT > 0 ? "#fbbf24" : "#fb7185";
    ctx.lineWidth = 2.5;
    roundRect(x, y, w, h, 14);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Segmented HP bar at top of Boss
    const barPad = 14;
    const barW = w - barPad * 2;
    const segGap = 3;
    const segW = Math.max(4, (barW - segGap * (boss.maxHp - 1)) / boss.maxHp);
    for (let i = 0; i < boss.maxHp; i++) {
      ctx.fillStyle = i < boss.hp ? "#fb7185" : "rgba(255, 255, 255, 0.1)";
      ctx.fillRect(x + barPad + i * (segW + segGap), y + 12, segW, 7);
    }

    // ASCII art crest
    ctx.fillStyle = "rgba(251, 113, 133, 0.78)";
    ctx.font = "10.5px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const asciiTop = y + 26;
    BOSS_ASCII.forEach((line, idx) => {
      ctx.fillText(line, x + w / 2, asciiTop + idx * 11.5);
    });

    // Core Word Box inside Boss
    const coreY = y + h - 82;
    const coreH = 66;
    ctx.fillStyle = boss.inZone ? "rgba(30, 27, 62, 0.98)" : "rgba(13, 11, 28, 0.95)";
    ctx.strokeStyle = boss.weak ? "#fbbf24" : (boss.inZone ? "#38bdf8" : "#a78bfa");
    ctx.lineWidth = 2;
    roundRect(x + 12, coreY, w - 24, coreH, 9);
    ctx.fill();
    ctx.stroke();

    ctx.textBaseline = "middle";
    ctx.fillStyle = boss.inZone ? "#e0f2fe" : "#f8fafc";
    ctx.font = "bold 17px monospace";
    ctx.fillText(boss.shown, x + w / 2, coreY + 24);

    ctx.fillStyle = "#c4b5fd";
    ctx.font = "12.5px monospace";
    ctx.fillText(boss.vi, x + w / 2, coreY + 47);

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shakeT > 0) ctx.translate(rand(-5, 5), rand(-5, 5));

    for (const st of stars) {
      ctx.fillStyle = `rgba(226, 232, 240, ${st.a})`;
      ctx.beginPath();
      ctx.arc(st.x % W, st.y % H, st.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = "rgba(167, 139, 250, 0.06)";
    ctx.lineWidth = 1;
    for (let i = 0; i < laneCount; i++) {
      const ly = laneY(i);
      ctx.beginPath();
      ctx.moveTo(cannon.x + 60, ly);
      ctx.lineTo(W - 16, ly);
      ctx.stroke();
    }

    const dangerX = cannon.x + 44;
    const hintX = dangerX + hintZoneWidth(false);

    ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(hintX, TOP);
    ctx.lineTo(hintX, H - BOTTOM + 16);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(56, 189, 248, 0.45)";
    ctx.font = "10px monospace";
    ctx.textAlign = "center";
    ctx.fillText("vùng gợi ý", (dangerX + hintX) / 2, H - BOTTOM + 14);

    ctx.strokeStyle = "rgba(251, 113, 133, 0.55)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(dangerX, TOP);
    ctx.lineTo(dangerX, H - BOTTOM + 16);
    ctx.stroke();
    ctx.setLineDash([]);

    drawCannon();
    drawBoss();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const e of enemies) {
      const y = laneY(e.lane) - BLOCK_H / 2;
      const activeGlow = e.targeted || e.flash > 0 || e.inZone || e.weak;

      ctx.save();
      if (activeGlow) {
        ctx.shadowColor = e.weak
          ? "rgba(251, 191, 36, 0.45)"
          : (e.targeted ? "rgba(167, 139, 250, 0.55)" : "rgba(56, 189, 248, 0.35)");
        ctx.shadowBlur = 14;
      }
      ctx.fillStyle = e.isMissile
        ? "rgba(38, 16, 36, 0.95)"
        : (e.inZone ? "rgba(24, 24, 52, 0.96)" : "rgba(19, 16, 40, 0.94)");
      ctx.strokeStyle = e.weak
        ? "#fbbf24"
        : (e.isMissile ? "#fb7185" : (e.targeted ? "#a78bfa" : (e.inZone ? "#38bdf8" : "#3b3566")));
      ctx.lineWidth = (e.targeted || e.flash > 0 || e.weak) ? 2.5 : 1.5;
      roundRect(e.x, y, e.w, BLOCK_H, 8);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      if (e.weak) {
        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 9px monospace";
        ctx.fillText("★ TỪ YẾU (x2)", e.x + e.w / 2, y - 7);
      } else if (e.isMissile) {
        ctx.fillStyle = "#fb7185";
        ctx.font = "bold 9px monospace";
        ctx.fillText("▼ TÊN LỬA", e.x + e.w / 2, y - 7);
      }

      ctx.fillStyle = e.inZone ? "#e0f2fe" : "#f8fafc";
      ctx.font = "bold 18px monospace";
      ctx.fillText(e.shown, e.x + e.w / 2, y + 22);

      ctx.fillStyle = "#a5b4fc";
      ctx.font = "13px monospace";
      ctx.fillText(e.vi, e.x + e.w / 2, y + 44);

      if (e.hits) {
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(e.x + 4, y + BLOCK_H - 5, (e.w - 8) * e.hits / TURRET_HITS, 3);
      }
    }

    for (const s of shots) {
      ctx.save();
      ctx.shadowColor = s.kind === "main" ? "#a78bfa" : "#38bdf8";
      ctx.shadowBlur = 12;
      ctx.fillStyle = s.kind === "main" ? "#f1effc" : "#38bdf8";
      ctx.strokeStyle = s.kind === "main" ? "#a78bfa" : "#38bdf8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.kind === "main" ? 6 : 4, 0, Math.PI * 2);
      s.kind === "main" ? ctx.fill() : ctx.stroke();
      ctx.restore();
    }

    ctx.font = "bold 15px monospace";
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col || "#a78bfa";
      ctx.fillText(p.ch, p.x, p.y);
    }

    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.fillStyle = f.col || "#f1effc";
      ctx.font = f.small ? "bold 12px monospace" : "bold 18px monospace";
      ctx.fillText(f.text, f.x, f.y - 30);
    }
    ctx.globalAlpha = 1;

    if (state === "play" && R.banner > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, R.banner / 0.6);
      ctx.shadowColor = isBossWave(R.wave) ? "rgba(251, 113, 133, 0.65)" : "rgba(167, 139, 250, 0.5)";
      ctx.shadowBlur = 20;
      ctx.fillStyle = isBossWave(R.wave) ? "#fb7185" : "#f1effc";
      ctx.font = "bold 40px monospace";
      ctx.fillText(isBossWave(R.wave) ? `ĐỢT ${R.wave} — BOSS!` : `ĐỢT ${R.wave}`, W / 2, H / 2 - 12);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#c4b5fd";
      ctx.font = "13px monospace";
      ctx.fillText(
        isBossWave(R.wave)
          ? "bắn hạ lõi từ vựng của Boss & đánh chặn tên lửa!"
          : (R.curse
              ? `lời nguyền: ${CURSES[R.curse].name} — ${CURSES[R.curse].desc} (xu x${CURSE_COIN_MULT})`
              : `${R.toSpawn} từ vựng đang tiến tới`),
        W / 2, H / 2 + 28
      );
      ctx.restore();
    }
    ctx.restore();
  }

  function loop(t) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min((t - last) / 1000, 0.05); last = t;
    if (state !== "paused") update(dt);
    draw();
  }

  function startGame() {
    cancelAnimationFrame(raf);
    sizeCanvas(); newRun(); hideOv();
    state = "intro"; last = performance.now();
    raf = requestAnimationFrame(loop);
  }
  function stopGame() {
    if (running()) awardShards();
    cancelAnimationFrame(raf); state = "idle";
    hideOv(); input.blur();
  }

  /* ---- input & vocab upload ---- */
  input.addEventListener("input", () => {
    if (state !== "play") return;
    const v = norm(input.value);
    if (!v) return;
    const hit = enemies.filter(e => !e.dead && !e.targeted && norm(e.word) === v).sort((a, b) => a.x - b.x)[0];
    if (hit) { fire(hit); input.value = ""; return; }
    if (boss && boss.hp > 0 && !boss.targeted && norm(boss.word) === v) {
      fire(boss);
      input.value = "";
    }
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && input.value && state === "play") {
      R.streak = 0;
      // Log front-most active target into Sổ Tử Huyệt when user submits wrong spelling
      const frontEnemy = enemies.filter(en => !en.dead && !en.targeted).sort((a, b) => a.x - b.x)[0];
      if (frontEnemy) {
        frontEnemy.weak = true;
        recordWeakWord(frontEnemy.word, frontEnemy.vi);
      } else if (boss && boss.hp > 0) {
        boss.weak = true;
        recordWeakWord(boss.word, boss.vi);
      }
      input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      input.value = "";
    }
  });
  frame.addEventListener("click", e => {
    if (e.target.closest("#bar") || e.target.closest("#ov")) return;
    if (body.classList.contains("game") && state === "play") input.focus();
  });

  $("#workshop").onclick = () => {
    if (state !== "play") return;
    prevState = state; state = "paused"; input.blur(); showOv("workshop");
  };
  const statusEl = $("#status");
  $("#upload").onclick = () => $("#file").click();
  $("#menuUpload").onclick = () => $("#file").click();
  $("#file").onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    const list = parseVocab(await f.text(), f.name);
    ev.target.value = "";
    if (!list.length) {
      const msg = "file không hợp lệ (định dạng: tiếng anh, tiếng việt)";
      vocabInfo.textContent = msg;
      statusEl.textContent = msg;
      return;
    }
    vocab = list;
    importedVocab = list.slice();
    try { localStorage.setItem("wa_vocab", JSON.stringify(vocab)); } catch (e) {}
    updateVocabMeta();
    fitArt();
    seedFloatingWords();
    statusEl.textContent = `Đã nạp ${list.length} từ từ "${f.name}"`;
    if (body.classList.contains("game")) {
      if (running()) awardShards();
      startGame();
    }
  };
  $("#diff").onchange = () => { $("#diff").blur(); if (state === "play") input.focus(); };

  /* =====================================================
   *  MENU
   * ===================================================== */
  function enterGame(fn) {
    body.classList.add("game");
    statusEl.textContent = "";
    setTimeout(fn, 760);
  }
  function leaveGame() {
    stopGame();
    body.classList.remove("game");
    setTimeout(() => { fitArt(); }, 760);
  }
  $("#back").onclick = leaveGame;

  const MODES = [
    { name: "Pháo Đài Từ Vựng", start: startGame },
    { name: "Xếp Chữ Ngược" },
    { name: "Đoán Chữ Treo Cổ" },
    { name: "Đua Gõ Tốc Độ" },
    { name: "Nghe & Chọn Từ" },
    { name: "Ghép Câu Hoàn Chỉnh" },
    { name: "Điền Vào Chỗ Trống" },
    { name: "Dịch Nhanh Phản Xạ" },
  ];
  MODES.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "mode" + (m.start ? " ready" : "");
    b.innerHTML = `<span>${m.name}</span><span class="idx">${m.start ? "SẴN SÀNG" : String(i + 1).padStart(2, "0")}</span>`;
    b.onclick = () => m.start ? enterGame(m.start) : (statusEl.textContent = `[${m.name}] — chế độ này đang được phát triển`);
    $("#modes").appendChild(b);
  });
})();
</script>
</body>
</html>
